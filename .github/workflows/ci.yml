name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Sync dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q

      - name: Secret scan
        run: |
          if git grep -nE "(app_secret|api_key|password)\s*=\s*['\"][A-Za-z0-9]{8,}" -- ':!.env.example' ':!*.md'; then
            echo "possible hardcoded secret"; exit 1
          fi
